<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes">
  <!-- No-op until loaded dynamically (could make configurable) -->
  <link rel="icon" href="images/logo.svg">
  <!-- STYLESHEETS (others loaded dynamically) -->
  <style id="styleoverrides" media="screen"></style>
  <link href="./svgedit.css" rel="stylesheet" media="all">
  <!-- Lacking browser support -->
  <script type="module" src="./browser-not-supported.js"></script>
  <title>SVG-edit</title>
</head>

<body style="margin:0">
  <!-- svgedit container can be positionned anywhere in the DOM
       but it must have a width and a height -->
  <!--
  <h1>SVGEdit</h1>
  <div id="container" style="width:100%;height:550px"></div>
  <h1>End</h1>
  -->
  <div id="container" style="width:100%;height:100vh"></div>
</body>
<!-- If you do not wish to add extensions by URL, you can add calls
      within the following file to svgEditor.setConfig -->
<script type="module">
  import Editor from './Editor.js'
  import { sparesConfig } from './extensions/ext-spares/config.js'
  /* for available options see the file `docs/tutorials/ConfigOptions.md */
  const svgEditor = new Editor(document.getElementById('container'))
  const extensions = [
    'ext-connector',
    'ext-eyedropper',
    'ext-grid',
    'ext-markers',
    'ext-panning',
    'ext-shapes',
    'ext-polystar',
    'ext-storage',
    'ext-opensave',
    'ext-layer_view'
  ]
  const otherExtensions = [
    // "ext-codemirror",
    // 'ext-helloworld',
    'ext-spares',
    // 'ext-xdomain-messaging',
  ]
  extensions.push(...otherExtensions);
  // Embedded in the spares frontend, the image occlusion is saved to the server. Storing it in the
  // browser too would share the frontend's storage and prompt on every open.
  if (new URLSearchParams(window.location.search).get('embedded') === '1') {
    extensions.splice(extensions.indexOf('ext-storage'), 1)
  }

  // From the user's spares config. The fallbacks are the defaults of `ImageOcclusionConfig`.
  const hex = (color, fallback) => (color ?? fallback).replace(/^#/, '')
  svgEditor.setConfig({
    allowInitialUserOverride: true,
    noDefaultExtensions: true,
    no_save_warning: true,
    initFill: {
      color: hex(sparesConfig.fill_color, 'FFEBA2'),
    },
    initStroke: {
      width: sparesConfig.stroke_width ?? 1,
      color: hex(sparesConfig.stroke_color, '000000'),
    },
    text: {
      stroke_width: 0,
      font_size: sparesConfig.font_size ?? 16,
      font_family: sparesConfig.font_family ?? 'Sans-serif',
    },
    initTool: sparesConfig.initial_tool ?? 'rect',
    allowedOrigins: ['null'],
    showlayers: true,
    // canvasName: "default",
    noStorageOnLoad: true,
    // dynamicOutput: false,
    // userExtensions: [/* { pathName: '/packages/react-test/dist/react-test.js' } */]
    extensions: extensions,
  })
  svgEditor.init()
  // svgEditor.svgCanvas.renameCurrentLayer("Markup")
  // svgEditor.svgCanvas.createLayer("Clozes")
  // svgEditor.svgCanvas.setCurrentLayer("Clozes")
  //
  // let markupGroup = svgEditor.svgCanvas.getCurrentDrawing().layer_map["Markup"].getGroup()
  // markupGroup.setAttribute("id", "markup-group")
  //
  // let clozesGroup = svgEditor.svgCanvas.getCurrentDrawing().layer_map["Clozes"].getGroup()
  // clozesGroup.setAttribute("id", "clozes-group")

  if (typeof XDOMAIN !== 'undefined' && XDOMAIN) {
    svgEditor.setConfig({
      canvasName: 'xdomain', // Namespace this
      allowedOrigins: ['*']
    })
    console.info('xdomain config activated')
  }
</script>

</html>
